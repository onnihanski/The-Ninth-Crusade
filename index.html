<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>The Ninth Crusade</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: #131218;
    --line: #2a2731;
    --text: #cfc7b8;
    --dim: #75705f;
    --mono: "IBM Plex Mono", "DejaVu Sans Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  main { display: flex; gap: 16px; align-items: flex-start; max-width: 100%; }
  #screen {
    display: block;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    image-rendering: pixelated;
    max-width: 100%;
  }
  aside {
    width: 286px;
    flex: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: 0.02em; }
  #tagline { color: var(--dim); font-size: 11px; margin: 3px 0 14px; line-height: 1.4; }
  section { margin-bottom: 14px; }
  h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--dim); margin: 0 0 6px; font-weight: 600;
  }
  #depth { font-size: 13px; margin-bottom: 6px; }
  #hp-bar, #xp-bar {
    height: 8px; background: #05070a; border-radius: 2px;
    overflow: hidden; margin-bottom: 4px;
  }
  #xp-bar { height: 4px; margin-top: 6px; }
  #xp-fill { height: 100%; width: 0; transition: width 120ms linear; }
  #level { margin-top: 8px; font-size: 12px; }
  #xp-text { color: var(--dim); font-size: 10px; }
  @media (prefers-reduced-motion: reduce) { #xp-fill { transition: none; } }
  #hp-fill { height: 100%; width: 100%; transition: width 120ms linear; }
  @media (prefers-reduced-motion: reduce) { #hp-fill { transition: none; } }
  #hp-text, #stats { color: var(--dim); font-size: 11px; }
  ul { list-style: none; margin: 0; padding: 0; }
  #inventory li, #help li, #worn li { padding: 2px 0; font-size: 11px; }
  #inventory li[data-item], #worn li[data-item] {
    display: flex; align-items: baseline; gap: 6px; cursor: help;
    border-radius: 2px; padding: 2px 3px; margin: 0 -3px;
  }
  #inventory li[data-item]:hover, #worn li[data-item]:hover,
  #inventory li[data-item]:focus, #worn li[data-item]:focus {
    background: #05070a; outline: none;
  }
  #inventory li[data-item]:focus-visible, #worn li[data-item]:focus-visible {
    outline: 1px solid var(--dim);
  }
  .iname { flex: 1; }
  .icat {
    color: var(--dim); font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.08em; flex: none;
  }
  #tooltip {
    position: fixed; z-index: 20; width: 264px; max-width: calc(100vw - 16px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 10px 12px; pointer-events: none;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
  }
  #tooltip[hidden] { display: none; }
  #tooltip h3 { margin: 0 0 2px; font-size: 12px; font-weight: 600; }
  .tip-meta {
    color: var(--dim); font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 7px;
  }
  #tooltip ul { margin: 0 0 8px; }
  #tooltip li {
    font-size: 11px; line-height: 1.4; padding-left: 9px; position: relative;
  }
  #tooltip li::before { content: '·'; position: absolute; left: 0; color: var(--dim); }
  .tip-lore {
    margin: 0; font-size: 10.5px; line-height: 1.5; color: var(--dim);
    border-top: 1px solid var(--line); padding-top: 7px;
  }
  #worn li { display: flex; gap: 8px; }
  #worn .slot { color: var(--dim); width: 52px; flex: none; }
  #worn .empty { color: var(--dim); }
  .stat { margin-right: 10px; color: var(--dim); font-size: 11px; }
  .stat b { font-weight: 600; font-variant-numeric: tabular-nums; }
  #help li { display: flex; justify-content: space-between; gap: 8px; color: var(--dim); }
  #inventory .empty { color: var(--dim); }
  kbd {
    font-family: inherit; font-size: 10px; background: #05070a;
    border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; color: var(--text);
  }
  #log {
    height: 190px; overflow-y: auto; font-size: 11px; line-height: 1.45;
    border-top: 1px solid var(--line); padding-top: 8px;
  }
  #log li { margin-bottom: 2px; }
  #log em { font-style: normal; color: var(--dim); }
  #seed { color: var(--dim); font-size: 10px; margin-top: 12px; }
  #crusader { color: var(--dim); font-size: 10px; margin-top: 8px; letter-spacing: 0.02em; }
  #region { font-size: 12px; letter-spacing: 0.04em; }
  .tag {
    display: inline-block; font-size: 10px; padding: 1px 5px; margin: 1px 0;
    border: 1px solid var(--line); border-radius: 3px;
  }
  #seals .empty, #statuses:empty { color: var(--dim); font-size: 10px; }
  body.over #screen { filter: saturate(0.3) brightness(0.7); }
  @media (max-width: 900px) { main { flex-direction: column; align-items: center; } }
</style>
</head>
<body>
<main>
  <canvas id="screen"></canvas>
  <aside>
    <h1 id="title"></h1>
    <p id="tagline"></p>

    <section>
      <div id="region"></div>
      <div id="depth"></div>
      <div id="hp-bar"><div id="hp-fill"></div></div>
      <div id="hp-text"></div>
      <div id="level"></div>
      <div id="xp-bar"><div id="xp-fill"></div></div>
      <div id="xp-text"></div>
      <div id="stats"></div>
      <div id="statuses"></div>
      <div id="crusader"></div>
    </section>

    <section>
      <h2>Seals</h2>
      <div id="seals"></div>
    </section>

    <section>
      <h2>Kit</h2>
      <ul id="worn"></ul>
    </section>

    <section>
      <h2>Pack</h2>
      <ul id="inventory"></ul>
    </section>

    <section>
      <h2>Keys</h2>
      <ul id="help"></ul>
    </section>

    <ul id="log"></ul>
    <div id="seed"></div>
  </aside>
</main>
<div id="tooltip" role="tooltip" aria-hidden="true" hidden></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
