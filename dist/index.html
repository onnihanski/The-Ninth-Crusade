// ==== src/game/game.js =====================
const ACT_COST = 100;
const MAX_LOG = 200;

// Something else comes down the corridor every so often. Without wanderers,
// regeneration makes health free: clear a floor, rest to full, repeat. This is
// what puts a price on standing still, and it is why resting is a decision
// rather than a formality.
const WANDER_EVERY = 45;
const WANDER_MIN_DISTANCE = 12;

// The Game owns all mutable state and knows nothing about the DOM, which is
// what lets tests/smoke.mjs drive full crusades headlessly under node.
class Game {
  constructor({ seed, width = 72, height = 34, theme = THEME, memorial } = {}) {
    this.theme = theme;
    this.width = width;
    this.height = height;
    this.seed = seed ?? (Math.random() * 0xffffffff) >>> 0;
    this.rng = new RNG(this.seed);
    this.memorial = memorial ?? new Memorial();
    this.messages = [];
    this.state = 'playing';
    this.turn = 0;
    this.echoes = [];
    this.runRecorded = false;

    this.crusaderName = crusaderName(this.rng);
    this.player = makePlayer(0, 0, this.crusaderName);
    this.player.energy = ACT_COST; // start ready to act

    this.buildLevel(1);

    const nth = ordinal(this.memorial.runNumber());
    this.log('You are the ' + nth + ' crusader sent down.', 'notable');
    if (this.memorial.entries.length) {
      this.log('The others are still here, in their fashion.', 'mythic');
    }
    this.log(this.region.arrival, 'textDim');
  }

  // -- level lifecycle ------------------------------------------------------

  buildLevel(depth) {
    this.region = regionForDepth(depth);
    this.level = new Level(this.rng, this.width, this.height, depth);
    this.level.region = this.region;

    const start = this.level.rooms[0];
    this.player.x = start.cx;
    this.player.y = start.cy;
    this.level.add(this.player);

    this.wanderers = 0;
    this.echoes = [];              // a note does not carry between floors
    this.setUpGate(depth);
    this.populate(depth);
    this.summonTheRemembered(depth);

    this._distCache = null;
    this.level.updateFov(this.player, this.theme.fovRadius);
  }

  /**
   * Boss floors replace their stairs with a sealed gate. The final region has
   * no way down at all -- the only exit is the thing you came for.
   */
  setUpGate(depth) {
    const { x, y } = this.level.stairs;
    if (!isBossDepth(depth)) {
      this.level.sealed = false;
      return;
    }

    if (this.region.final) {
      this.level.tiles.set(x, y, Tiles.floor);
      this.level.sealed = false;
      this.level.stairs = null;
      return;
    }

    this.level.tiles.set(x, y, Tiles.sealedGate);
    this.level.sealed = true;
  }

  nextLevel() {
    const depth = this.level.depth + 1;
    const previousRegion = this.region;
    // Carrying the player entity across means inventory, HP and wards persist.
    this.level.remove(this.player);
    this.buildLevel(depth);
    this.log('You go down. Depth ' + depth + '.', 'notable');
    if (this.region !== previousRegion) this.log(this.region.arrival, 'mythic');
  }

  populate(depth) {
    const boss = isBossDepth(depth);
    const monsters = monsterTable(this.region, depth);
    const relics = itemTable(depth);
    const rooms = this.level.rooms.slice(1); // room 0 is the player's one safe breath
    if (!rooms.length) return;

    // A budget for the whole floor, not dice per room: room count is whatever
    // mapgen happened to fit, and letting it set the population made shallow
    // floors unsurvivable.
    // Depth 1 is where a player learns the verbs; it gets three. The curve
    // catches up to the old numbers by the middle of the dungeon.
    const monsterCount = boss
      ? 2 + Math.floor(depth / 4)
      : 2 + Math.round(depth * 0.9);
    for (let i = 0; i < monsterCount; i++) {
      const spot = this.freeSpotInRoom(this.rng.pick(rooms));
      if (spot) this.level.add(makeMonster(this.rng.weighted(monsters), spot.x, spot.y));
    }

    const relicCount = relics.length ? this.rng.int(2, 4) : 0;
    for (let i = 0; i < relicCount; i++) {
      const spot = this.freeSpotInRoom(this.rng.pick(rooms));
      if (spot) this.level.add(makeItem(this.rng.weighted(relics), spot.x, spot.y));
    }

    if (boss) this.placeBoss();
  }

  /** The boss stands on the way out, because of course it does. */
  placeBoss() {
    const spec = { key: this.region.boss, ...MONSTERS[this.region.boss] };
    const lastRoom = this.level.rooms[this.level.rooms.length - 1];
    const spot = this.freeSpotInRoom(lastRoom) ?? this.freeSpotInRoom(this.level.rooms[1]);
    if (!spot) return;
    this.level.add(makeMonster(spec, spot.x, spot.y));
    this.bossSpec = spec;
  }

  /**
   * THE DUNGEON REMEMBERS. Everyone who died on this depth is still down here,
   * holding what they were holding.
   */
  summonTheRemembered(depth) {
    const dead = this.memorial.atDepth(depth);
    if (!dead.length) return;

    const rooms = this.level.rooms.slice(1);
    for (const entry of dead) {
      const room = this.rng.pick(rooms.length ? rooms : this.level.rooms);
      const spot = this.freeSpotInRoom(room);
      if (spot) this.level.add(makeRevenant(entry, spot.x, spot.y));
    }
    this.log(
      dead.length === 1
        ? 'Someone you used to be is down here.'
        : dead.length + ' of your predecessors are down here.',
      'mythic',
    );
  }

  freeSpotInRoom(room) {
    for (let tries = 0; tries < 20; tries++) {
      const x = this.rng.int(room.x, room.x + room.w - 1);
      const y = this.rng.int(room.y, room.y + room.h - 1);
      if (this.level.isOpen(x, y)) return { x, y };
    }
    return null;
  }

  randomOpenTile() {
    for (let tries = 0; tries < 400; tries++) {
      const x = this.rng.int(1, this.level.width - 2);
      const y = this.rng.int(1, this.level.height - 2);
      if (this.level.isOpen(x, y)) return { x, y };
    }
    return null;
  }

  // -- seals, bosses, endings -----------------------------------------------

  onBossDefeated(boss) {
    if (boss.entranceShown !== undefined) delete boss.entranceShown;
    this.log('The way is no longer being argued about.', 'mythic');
  }

  /** Called when a seal reaches the pack. Opens this floor's gate, if it fits. */
  tryUnseal(item) {
    if (!item.item?.seal || !this.level.sealed) return false;
    if (item.item.seal !== this.region.key) return false;

    const { x, y } = this.level.stairs;
    this.level.tiles.set(x, y, Tiles.stairsDown);
    this.level.sealed = false;
    this.log(this.theme.strings.unsealed, 'notable');
    return true;
  }

  claimVictory() {
    this.state = 'won';
    this.log(this.theme.strings.victory, 'notable');
    this.finishRun('walked out');
  }

  /**
   * Spill a dead thing's drops onto the floor where it fell. A drop is either a
   * bare item key (bosses) or `{ key, heirloom }` (anything taken off a
   * revenant, which carries the history of who died in it).
   */
  spillDrops(entity) {
    if (!entity.drops?.length) return;
    for (const drop of entity.drops) {
      const { key, heirloom } = typeof drop === 'string' ? { key: drop, heirloom: null } : drop;
      const spec = ITEMS[key];
      if (!spec) continue;
      const spot = this.level.isWalkable(entity.x, entity.y)
        ? { x: entity.x, y: entity.y }
        : this.randomOpenTile();
      if (!spot) continue;

      this.level.add(makeItem({ key, ...spec, heirloom }, spot.x, spot.y));
      this.log('It drops ' + spec.name + (heirloom ? ', and it knows your name.' : '.'),
        heirloom ? 'mythic' : 'notable');
    }
    entity.drops = [];
  }

  /** Write this crusader into the memorial, once. */
  finishRun(killedBy) {
    if (this.runRecorded) return;
    this.runRecorded = true;
    this.memorial.record({
      name: this.crusaderName,
      depth: this.level.depth,
      level: this.player.level,
      power: this.player.power,
      defense: this.player.defense,
      maxHp: this.player.maxHp,
      region: this.region.name,
      killedBy,
      turn: this.turn,
      relics: this.player.inventory
        .filter((i) => i.item?.key && !i.item.victory)
        .map((i) => i.item.key),
      equipment: equipped(this.player).map((i) => ({
        key: i.item.key,
        heirloom: i.item.heirloom ?? null,
      })),
      at: Date.now(),
    });
  }

  // -- turn scheduling ------------------------------------------------------

  /**
   * Energy-based scheduler. Every actor banks `speed` energy per tick and acts
   * whenever it can afford ACT_COST, so a camp dog at speed 150 genuinely gets
   * extra turns rather than being special-cased.
   */
  playerActed() {
    this.player.energy -= ACT_COST;
    this.turn++;
    tickStatuses(this, this.player);
    tickReload(this.player);
    tickBlock(this.player);
    tickRegeneration(this.player);
    this.hintRegeneration();
    this.tickStillness();
    this.tickAttunement();
    this.tickEchoes();
    this.maybeWander();
    this.runMonsterTurns();
    this._distCache = null;

    if (this.player.alive) {
      this.level.updateFov(this.player, this.theme.fovRadius);
      this.announceBoss();
    } else {
      this.finishRun(this.lastAttacker ?? 'the dungeon');
    }
  }

  /** Bosses get one line, the first time you actually lay eyes on them. */
  announceBoss() {
    for (const e of this.level.entities) {
      if (!e.boss || !e.alive || e.announced) continue;
      if (!this.level.visible.get(e.x, e.y)) continue;
      e.announced = true;
      const spec = MONSTERS[this.region.boss];
      if (spec?.entrance) this.log(spec.entrance, 'mythic');
    }
  }

  runMonsterTurns() {
    // Loop ticks until the player has banked enough energy to act again.
    while (this.player.alive && this.player.energy < ACT_COST) {
      for (const actor of this.level.actors()) actor.energy += effectiveSpeed(actor);

      // Snapshot: AI turns can kill entities and mutate the list.
      for (const actor of [...this.level.entities]) {
        if (actor === this.player || !actor.ai || !actor.alive) continue;
        while (actor.energy >= ACT_COST && actor.alive && this.player.alive) {
          actor.energy -= ACT_COST;
          tickStatuses(this, actor);
          takeAiTurn(this, actor);   // ticks its own reload
        }
      }
      this._distCache = null;
    }
  }

  /**
   * Sanctuary counts turns held in one place. Tracked here rather than in the
   * move action because every other way of spending a turn counts as standing
   * still, and only actually moving should reset it.
   */
  tickStillness() {
    const moved = this._lastPos
      && (this._lastPos.x !== this.player.x || this._lastPos.y !== this.player.y);
    this.player.stillTurns = moved ? 0 : (this.player.stillTurns ?? 0) + 1;
    this._lastPos = { x: this.player.x, y: this.player.y };
  }

  /** Relics grow while they sit unused in the pack. */
  tickAttunement() {
    for (const item of this.player.inventory) {
      if (item.item.use?.attune) item.item.carried = (item.item.carried ?? 0) + 1;
    }
  }

  /** A note sounded earlier, finishing on its own and picking its own target. */
  tickEchoes() {
    if (!this.echoes.length) return;
    const due = [];
    this.echoes = this.echoes.filter((echo) => {
      echo.turns--;
      if (echo.turns > 0) return true;
      due.push(echo);
      return false;
    });

    for (const echo of due) {
      const struck = smiteNearest(this, this.player, echo.amount, echo.range,
        'The note finishes itself against');
      if (!struck) this.log('Somewhere behind you, a note finishes alone.', 'textDim');
    }
  }

  scheduleEcho(echo) {
    this.echoes.push({ ...echo });
  }

  /**
   * A new crusader has no way to know that standing still closes wounds, and
   * will bleed out on the first floor never having tried it. Said once.
   */
  hintRegeneration() {
    if (this.hintedRegen || !this.player.alive) return;
    if (this.player.hp > this.player.maxHp * 0.6) return;
    this.hintedRegen = true;
    this.log('Wounds close if you give them time. [space] to wait.', 'mythic');
  }

  /**
   * Send something down the corridor, out of sight and far enough away that it
   * has to arrive rather than appear. Capped per floor so a slow crusader is
   * pressured, not buried.
   */
  maybeWander() {
    if (this.turn === 0 || this.turn % WANDER_EVERY !== 0) return;
    // Nothing wanders onto the first floor. Wandering monsters exist to price
    // resting, and a player who has not yet learned that resting is possible
    // only experiences them as ambushes.
    const depth = this.level.depth;
    if (depth < 2) return;
    if (this.wanderers >= 1 + Math.floor(depth / 3)) return;

    const table = monsterTable(this.region, this.level.depth);
    for (let tries = 0; tries < 60; tries++) {
      const spot = this.randomOpenTile();
      if (!spot) return;
      if (this.level.visible.get(spot.x, spot.y)) continue;
      if (chebyshev(spot.x, spot.y, this.player.x, this.player.y) < WANDER_MIN_DISTANCE) continue;

      this.level.add(makeMonster(this.rng.weighted(table), spot.x, spot.y));
      this.wanderers++;
      this.log('Something else is down here with you.', 'textDim');
      return;
    }
  }

  /** Distance-to-player map, rebuilt at most once per scheduler tick. */
  playerDistanceMap() {
    if (!this._distCache) {
      this._distCache = dijkstraMap(
        this.level.width,
        this.level.height,
        [[this.player.x, this.player.y]],
        (x, y) => this.level.isWalkable(x, y),
      );
    }
    return this._distCache;
  }

  // -- presentation helpers -------------------------------------------------

  /** Theme palette with the current region's tint applied. */
  palette() {
    return { ...this.theme.colors, ...(this.region.palette ?? {}) };
  }

  seals() {
    return this.player.seals;
  }

  // -- message log ----------------------------------------------------------

  log(text, color = 'text') {
    const last = this.messages[this.messages.length - 1];
    if (last && last.text === text) {
      last.count++;
      return;
    }
    this.messages.push({ text, color, count: 1 });
    if (this.messages.length > MAX_LOG) this.messages.shift();
  }
}

// ==== src/game/actions.js ==================
const MAX_PACK = 9;

// Every action returns true if it consumed the actor's turn. Actions that fail
// for a reason the player could have known (walking into a wall) return false,
// so a misclick never costs a turn -- monsters do not get a free hit from it.

function moveOrAttack(game, actor, dx, dy) {
  const nx = actor.x + dx;
  const ny = actor.y + dy;
  const level = game.level;

  const blocker = level.blockerAt(nx, ny);
  if (blocker && blocker !== actor) {
    meleeStrike(game, actor, blocker);
    return true;
  }

  // Reach: strike over the empty tile in front of you. You hit first, and you
  // keep hitting while giving ground -- which is what makes it worth the slot.
  if (hasTrait(actor, 'reach') && level.isWalkable(nx, ny)) {
    const far = level.blockerAt(actor.x + dx * 2, actor.y + dy * 2);
    if (far && far !== actor && far.alive) {
      meleeStrike(game, actor, far);
      return true;
    }
  }

  if (!level.isWalkable(nx, ny)) {
    if (actor.isPlayer) game.log('Blocked.', 'textDim');
    return false;
  }

  actor.x = nx;
  actor.y = ny;

  if (actor.isPlayer) {
    const items = level.itemsAt(nx, ny);
    if (items.length) {
      game.log('At your feet: ' + items.map((i) => i.name).join(', ') + '. [g] to take.', 'textDim');
    }
  }
  return true;
}

function wait() {
  return true;
}

/**
 * Shoot the nearest thing you can see inside your weapon's range. Auto-target
 * rather than a cursor: with one shot every few turns, choosing the target is
 * rarely the interesting decision -- choosing when to give ground is.
 */
function fire(game, actor) {
  const profile = rangedProfile(actor);
  if (!profile) {
    game.log('You have nothing that shoots.', 'textDim');
    return false;
  }
  if (!canFire(actor)) {
    game.log('Still reloading.', 'textDim');
    return false;
  }

  if (hasTrait(actor, 'pierce')) return firePiercing(game, actor, profile);

  const target = nearestTargetInRange(game, actor, profile.range);
  if (!target) {
    game.log('Nothing in range.', 'textDim');
    return false;
  }

  shoot(game, actor, target, profile);
  return true;
}

/**
 * A piercing bolt runs on through everything in its line, so it aims at
 * whichever visible target puts the most bodies on one line rather than simply
 * the nearest. Lining them up in a corridor is the reward.
 */
function firePiercing(game, actor, profile) {
  const level = game.level;
  const candidates = visibleTargets(game, actor, profile.range);
  if (!candidates.length) {
    game.log('Nothing in range.', 'textDim');
    return false;
  }

  let best = null;
  for (const candidate of candidates) {
    const path = line(actor.x, actor.y, candidate.x, candidate.y);
    const struck = [];
    for (const [x, y] of path) {
      if (level.isOpaque(x, y)) break;          // the bolt is stopped by stone
      const foe = level.blockerAt(x, y);
      if (foe && foe.ai && foe.alive) struck.push(foe);
    }
    if (!struck.length) continue;
    if (!best || struck.length > best.length) best = struck;
  }

  if (!best) {
    game.log('Nothing in range.', 'textDim');
    return false;
  }

  if (best.length > 1) {
    game.log('The bolt goes through ' + best.length + ' of them.', 'notable');
  }
  // One shot, one reload, however many it passes through.
  for (const foe of best) {
    if (foe.alive) attack(game, actor, foe, { power: profile.power, verb: 'shoot' });
  }
  startReloadFor(actor, profile);
  return true;
}

function startReloadFor(actor, profile) {
  actor.reloadLeft = profile.reload;
}

function visibleTargets(game, actor, range) {
  return game.level.entities.filter((entity) =>
    entity.ai && entity.alive
    && game.level.visible.get(entity.x, entity.y)
    && chebyshev(actor.x, actor.y, entity.x, entity.y) <= range);
}

function nearestTargetInRange(game, actor, range) {
  let best = null;
  let bestDistance = Infinity;
  for (const entity of game.level.entities) {
    if (!entity.ai || !entity.alive) continue;
    if (!game.level.visible.get(entity.x, entity.y)) continue;
    const distance = chebyshev(actor.x, actor.y, entity.x, entity.y);
    if (distance <= range && distance < bestDistance) {
      best = entity;
      bestDistance = distance;
    }
  }
  return best;
}

function pickUp(game, actor) {
  const items = game.level.itemsAt(actor.x, actor.y);
  if (!items.length) {
    game.log('Nothing here worth carrying.', 'textDim');
    return false;
  }

  const item = items[0];

  // Seals and the Relic never occupy pack space. They are the way forward, and
  // a full pack must never be able to strand a crusader on a sealed floor with
  // the seal lying at their feet.
  if (item.item.victory) {
    game.level.remove(item);
    game.log('Taken: ' + item.name + '.', 'notable');
    if (item.item.flavour) game.log(item.item.flavour, 'textDim');
    game.claimVictory();
    return true;
  }

  if (item.item.seal) {
    game.level.remove(item);
    actor.seals.push(item);
    game.log('Taken: ' + item.name + '.', 'notable');
    if (item.item.flavour) game.log(item.item.flavour, 'textDim');
    game.tryUnseal(item);
    return true;
  }

  if (actor.inventory.length >= MAX_PACK) {
    game.log('Your pack is full. The crusade did not budget for this. [x] to drop.', 'textDim');
    return false;
  }

  game.level.remove(item);
  actor.inventory.push(item);
  game.log('Taken: ' + item.name + '.', 'notable');
  if (item.item.flavour) game.log(item.item.flavour, 'textDim');
  return true;
}

/** Put something down. The pack is small, so this is a real decision. */
function dropItem(game, actor, index) {
  const item = actor.inventory[index];
  if (!item) {
    game.log('Nothing in that slot.', 'textDim');
    return false;
  }
  actor.inventory.splice(index, 1);
  item.x = actor.x;
  item.y = actor.y;
  game.level.add(item);
  game.log('You set down the ' + item.name + '.', 'textDim');
  return true;
}

const EQUIP_VERB = {
  weapon: 'You take up',
  shield: 'You strap on',
  armour: 'You put on',
};

function useItem(game, actor, index) {
  const item = actor.inventory[index];
  if (!item) {
    game.log('Nothing in that slot.', 'textDim');
    return false;
  }
  if (item.item.equip) return equipItem(game, actor, index);
  if (!item.item.use) {
    game.log('The ' + item.name + ' is for carrying, not for using.', 'textDim');
    return false;
  }

  const spent = applyEffect(game, actor, item);
  if (spent) actor.inventory.splice(index, 1);
  return spent;
}

/**
 * Wear or wield the item in that slot, stowing whatever it displaces. Gear is
 * never destroyed by swapping -- the old piece goes straight back in the pack.
 */
function equipItem(game, actor, index) {
  const item = actor.inventory[index];
  const slot = item.item.equip.slot;
  const displaced = actor.equipment[slot];
  const speedBefore = effectiveSpeed(actor);

  actor.inventory.splice(index, 1);
  actor.equipment[slot] = item;
  if (displaced) actor.inventory.push(displaced);

  game.log(
    EQUIP_VERB[slot] + ' the ' + item.name
      + (displaced ? ', and stow the ' + displaced.name + '.' : '.'),
    'notable',
  );

  // Weight is the trade, so say so plainly rather than hiding it in a stat.
  const delta = effectiveSpeed(actor) - speedBefore;
  if (delta < 0) game.log('You are slower under it.', 'textDim');
  else if (delta > 0) game.log('You move more freely without the weight.', 'textDim');

  return true;
}

function unequip(game, actor, slot) {
  const item = actor.equipment[slot];
  if (!item) return false;
  if (actor.inventory.length >= MAX_PACK) {
    game.log('No room in the pack for it.', 'textDim');
    return false;
  }
  actor.equipment[slot] = null;
  actor.inventory.push(item);
  game.log('You set aside the ' + item.name + '.', 'textDim');
  return true;
}

function descend(game) {
  const level = game.level;
  const tile = level.tiles.get(game.player.x, game.player.y);

  if (tile === Tiles.sealedGate) {
    const bossName = game.bossSpec?.name ?? 'something below';
    game.log(game.theme.strings.sealed(bossName), 'bad');
    return false;
  }

  if (tile !== Tiles.stairsDown) {
    game.log(game.theme.strings.noStairs, 'textDim');
    return false;
  }

  game.nextLevel();
  return true;
}

// ==== src/ui/render.js =====================
// Canvas glyph renderer. Draws a terminal, essentially: one monospace character
// per cell, three visibility states -- lit, remembered, unknown.
//
// Swapping this for a tileset later means changing only this file: everything
// else talks in glyphs and colour keys, never pixels.
class Renderer {
  constructor(canvas, theme) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.theme = theme;
    this.cellW = theme.cell.w;
    this.cellH = theme.cell.h;
  }

  resize(widthInCells, heightInCells) {
    const dpr = globalThis.devicePixelRatio || 1;
    const w = widthInCells * this.cellW;
    const h = heightInCells * this.cellH;
    this.canvas.width = w * dpr;
    this.canvas.height = h * dpr;
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  draw(game) {
    const { ctx, theme } = this;
    const level = game.level;
    const colors = game.palette();  // region tint applied

    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    ctx.font = theme.font;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';

    // Terrain, in two passes of brightness.
    for (let y = 0; y < level.height; y++) {
      for (let x = 0; x < level.width; x++) {
        const visible = level.visible.get(x, y);
        const explored = level.explored.get(x, y);
        if (!visible && !explored) continue;

        const tile = level.tiles.get(x, y);
        const base = colors[tile.key] ?? colors.text;
        this.putGlyph(x, y, tile.glyph, visible ? base : dim(base, colors.bg, 0.62));
      }
    }

    // Entities, but only where the player can actually see. Corpses and items
    // draw under anything standing on them.
    const sorted = [...level.entities].sort((a, b) => layer(a) - layer(b));
    for (const e of sorted) {
      if (!level.visible.get(e.x, e.y)) continue;
      this.putGlyph(e.x, e.y, e.glyph, colors[e.color] ?? colors.text);
    }
  }

  putGlyph(x, y, glyph, color) {
    this.ctx.fillStyle = color;
    this.ctx.fillText(glyph, x * this.cellW + this.cellW / 2, y * this.cellH + this.cellH / 2 + 1);
  }
}

function layer(entity) {
  if (entity.isPlayer) return 3;
  if (entity.ai && entity.alive) return 2;
  if (entity.item) return 1;
  return 0;
}

/** Blend `hex` toward `toward` by `amount` -- how remembered tiles are dimmed. */
function dim(hex, toward, amount) {
  const a = parseHex(hex);
  const b = parseHex(toward);
  const mix = a.map((channel, i) => Math.round(channel + (b[i] - channel) * amount));
  return 'rgb(' + mix.join(',') + ')';
}

function parseHex(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// ==== src/ui/input.js ======================
// Key bindings -> intents.
//
// WASD for the cardinals, QEZC for the diagonals. The diagonals are not
// optional garnish: monsters move and attack on all eight directions, so a
// player limited to four would be flanked with no way to answer. The numpad
// and arrow keys stay bound for people who reach for them.
const MOVES = {
  w: [0, -1], a: [-1, 0], s: [0, 1], d: [1, 0],
  q: [-1, -1], e: [1, -1], z: [-1, 1], c: [1, 1],
  ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
};

// Numpad only -- the digit row is inventory slots.
const NUMPAD_MOVES = {
  8: [0, -1], 2: [0, 1], 4: [-1, 0], 6: [1, 0],
  7: [-1, -1], 9: [1, -1], 1: [-1, 1], 3: [1, 1],
};

function keyToIntent(event) {
  const raw = event.key;
  const key = raw.length === 1 ? raw.toLowerCase() : raw;
  const fromNumpad = event.code.startsWith('Numpad');

  if (fromNumpad) {
    if (NUMPAD_MOVES[key]) return { type: 'move', dx: NUMPAD_MOVES[key][0], dy: NUMPAD_MOVES[key][1] };
    if (key === '5') return { type: 'wait' };
  }

  if (MOVES[key]) return { type: 'move', dx: MOVES[key][0], dy: MOVES[key][1] };

  if (/^[1-9]$/.test(key)) return { type: 'use', index: Number(key) - 1 };
  if (key === ' ' || key === '.') return { type: 'wait' };
  if (key === 'g' || key === ',') return { type: 'pickup' };
  if (key === 'x') return { type: 'drop' };
  if (key === 'f') return { type: 'fire' };
  if (raw === '>') return { type: 'descend' };
  if (key === 'r') return { type: 'restart' };
  return null;
}

const HELP = [
  ['move', 'W A S D'],
  ['diagonals', 'Q E Z C'],
  ['wait', 'space'],
  ['fire', 'f'],
  ['take', 'g'],
  ['use / wear', '1-9'],
  ['drop', 'x then 1-9'],
  ['descend', '>'],
  ['restart', 'r'],
];

// ==== src/ui/panel.js ======================
// The HTML side of the UI: who you are, where you are, what you are carrying,
// and what the dungeon has been saying.
class Panel {
  constructor(root, theme) {
    this.theme = theme;
    this.el = {};
    for (const id of ['depth', 'region', 'hp-fill', 'hp-text', 'stats', 'statuses',
      'inventory', 'worn', 'seals', 'log', 'seed', 'help', 'title', 'tagline', 'crusader',
      'level', 'xp-fill', 'xp-text', 'tooltip']) {
      this.el[id] = root.querySelector('#' + id);
    }

    // The pack and kit lists are rebuilt only when their contents change, so a
    // tooltip does not blink out from under the pointer every turn.
    this.kitSignature = null;

    this.el.title.textContent = theme.name;
    this.el.tagline.textContent = theme.tagline;
    this.el.help.innerHTML = HELP
      .map(([label, keys]) => '<li><span>' + label + '</span><kbd>' + keys + '</kbd></li>')
      .join('');
  }

  update(game) {
    const p = game.player;
    const colors = game.palette();
    const ratio = Math.max(0, p.hp) / p.maxHp;

    this.el.crusader.textContent = game.crusaderName;
    this.el.region.textContent = game.region.name;
    this.el.region.style.color = colors.notable;
    this.el.depth.textContent = this.theme.strings.floorLabel + ' ' + game.level.depth
      + (game.level.sealed ? '  — sealed' : '');

    this.el['hp-fill'].style.width = (ratio * 100).toFixed(1) + '%';
    this.el['hp-fill'].style.background =
      ratio > 0.5 ? colors.good : ratio > 0.25 ? colors.notable : colors.bad;
    this.el['hp-text'].textContent = Math.max(0, p.hp) + ' / ' + p.maxHp;

    const need = xpToNext(p.level);
    this.el.level.textContent = 'Level ' + p.level;
    this.el['xp-fill'].style.width = (100 * Math.min(1, p.xp / need)).toFixed(1) + '%';
    this.el['xp-fill'].style.background = colors.xp;
    this.el['xp-text'].textContent = p.xp + ' / ' + need + ' xp';
    // Show the numbers gear actually produces, not the naked ones.
    const speed = effectiveSpeed(p);
    this.el.stats.innerHTML =
      stat('power', effectivePower(p), p.power, colors)
      + stat('defense', effectiveDefense(p), p.defense, colors)
      + stat('speed', speed, 100, colors)
      + (rangedProfile(p)
        ? '<span class="stat">' + (p.reloadLeft > 0
          ? '<b style="color:' + colors.bad + '">reloading</b>'
          : '<b style="color:' + colors.good + '">loaded</b>') + '</span>'
        : '');

    const stances = (p.statuses ?? []).map((s) =>
      '<span class="tag" style="color:' + colors.good + '">'
      + s.kind + ' +' + s.amount + ' (' + s.turns + ')</span>');

    const sanctuary = sanctuaryBonus(p);
    if (sanctuary > 0) {
      stances.push('<span class="tag" style="color:' + colors.mythic + '">sanctuary +'
        + sanctuary + '</span>');
    }
    if (hasTrait(p, 'block')) {
      stances.push(p.blockCooldown > 0
        ? '<span class="tag" style="color:' + colors.bad + '">shield down (' + p.blockCooldown + ')</span>'
        : '<span class="tag" style="color:' + colors.good + '">shield up</span>');
    }
    this.el.statuses.innerHTML = stances.join(' ');

    this.game = game;
    this.renderKit(game, colors);

    const seals = game.seals();
    this.el.seals.innerHTML = seals.length
      ? seals.map((s) => '<span class="tag" style="color:' + colors.seal + '">'
        + escapeHtml(s.name) + '</span>').join(' ')
      : '<span class="empty">none yet</span>';

    const recent = game.messages.slice(-14);
    this.el.log.innerHTML = recent.map((m, i) => {
      const color = colors[m.color] ?? colors.text;
      const faded = i < recent.length - 5 ? 0.5 : 1;
      const suffix = m.count > 1 ? ' <em>x' + m.count + '</em>' : '';
      return '<li style="color:' + color + ';opacity:' + faded + '">'
        + escapeHtml(m.text) + suffix + '</li>';
    }).join('');
    this.el.log.scrollTop = this.el.log.scrollHeight;

    this.el.seed.textContent = 'seed ' + game.seed + '  ·  crusade #' + game.memorial.runNumber();
  }
}

const SLOT_LABEL = { weapon: 'held', shield: 'shield', armour: 'worn' };

/** A stat, with its modified value called out when gear has changed it. */
function stat(label, value, base, colors) {
  const color = value === base ? colors.textDim : value > base ? colors.good : colors.bad;
  return '<span class="stat">' + label
    + ' <b style="color:' + color + '">' + value + '</b></span>';
}

Panel.prototype.renderKit = function renderKit(game, colors) {
  const p = game.player;
  const stamp = (item) => item
    ? item.item.key + (item.item.heirloom ? '#' + item.item.heirloom.marks : '')
    : '-';
  const signature = p.inventory.map(stamp).join(',')
    + '|' + SLOTS.map((slot) => stamp(p.equipment[slot])).join(',');
  if (signature === this.kitSignature) return;
  this.kitSignature = signature;

  this.el.worn.innerHTML = SLOTS.map((slot) => {
    const item = p.equipment[slot];
    const label = '<span class="slot">' + SLOT_LABEL[slot] + '</span>';
    if (!item) return '<li>' + label + '<span class="empty">—</span></li>';
    const color = colors[item.color] ?? colors.gear;
    return '<li data-source="kit" data-slot="' + slot + '" tabindex="0">' + label
      + '<span style="color:' + color + '">' + escapeHtml(item.name) + '</span>'
      + heirloomMark(item, colors) + '</li>';
  }).join('');

  this.el.inventory.innerHTML = p.inventory.length
    ? p.inventory.map((item, i) => {
      const spec = ITEMS[item.item.key] ?? item.item;
      const color = colors[item.color] ?? colors.text;
      return '<li data-source="pack" data-index="' + i + '" tabindex="0">'
        + '<kbd>' + (i + 1) + '</kbd> '
        + '<span class="iname" style="color:' + color + '">' + escapeHtml(item.name)
        + '</span>' + heirloomMark(item, colors)
        + '<span class="icat">' + escapeHtml(itemCategory(spec)) + '</span></li>';
    }).join('')
    : '<li class="empty">(empty)</li>';

  this.bindTooltips(colors);
};

/**
 * Hovering an item explains what it does and where it came from. The mechanics
 * half is derived from the item data rather than written out again, so it can
 * never drift from what the game actually does.
 */
Panel.prototype.bindTooltips = function bindTooltips(colors) {
  const tip = this.el.tooltip;
  const rows = [
    ...this.el.inventory.querySelectorAll('[data-source]'),
    ...this.el.worn.querySelectorAll('[data-source]'),
  ];

  const instanceFor = (row) => {
    const p = this.game?.player;
    if (!p) return null;
    return row.dataset.source === 'kit'
      ? p.equipment[row.dataset.slot]
      : p.inventory[Number(row.dataset.index)];
  };

  const show = (row) => {
    const instance = instanceFor(row);
    const spec = instance && ITEMS[instance.item.key];
    if (!spec) return;
    const d = describeItem(spec, instance.item);
    const meta = [d.category, d.rarity].filter(Boolean).join(' · ');
    tip.innerHTML =
      '<h3 style="color:' + (colors[spec.color] ?? colors.text) + '">'
      + escapeHtml(d.name) + '</h3>'
      + '<div class="tip-meta">' + escapeHtml(meta) + '</div>'
      + (d.trait
        ? '<div class="tip-trait" style="color:' + colors.mythic + '">'
          + escapeHtml(d.trait.label) + '</div>'
          + '<p class="tip-trait-text">' + escapeHtml(d.trait.text) + '</p>'
        : '')
      + '<ul>' + d.effects.map((e) => '<li>' + escapeHtml(e) + '</li>').join('') + '</ul>'
      + (d.heirloom
        ? '<p class="tip-heirloom" style="color:' + colors.revenant + '">+'
          + d.heirloom.bonus + ' — ' + escapeHtml(d.heirloom.label) + '</p>'
        : '')
      + '<p class="tip-lore">' + escapeHtml(d.lore) + '</p>';
    tip.hidden = false;
    tip.setAttribute('aria-hidden', 'false');

    // Sits to the left of the panel, clamped into the viewport.
    const rect = row.getBoundingClientRect();
    const box = tip.getBoundingClientRect();
    const left = Math.max(8, rect.left - box.width - 12);
    const top = Math.min(
      Math.max(8, rect.top - 8),
      Math.max(8, window.innerHeight - box.height - 8),
    );
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  };

  const hide = () => {
    tip.hidden = true;
    tip.setAttribute('aria-hidden', 'true');
  };

  for (const row of rows) {
    row.addEventListener('mouseenter', () => show(row));
    row.addEventListener('focus', () => show(row));
    row.addEventListener('mouseleave', hide);
    row.addEventListener('blur', hide);
  }
  hide();
};

/** Gear taken off a predecessor wears its bonus openly in the list. */
function heirloomMark(item, colors) {
  const bonus = heirloomBonus(item.item.heirloom);
  if (!bonus) return '';
  return '<span class="heir" style="color:' + colors.revenant + '">+' + bonus + '</span>';
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}

// ==== src/main.js ==========================
// Bootstrap: owns the browser-facing bits and nothing else. All rules live in
// game/, which is why the whole game is testable under node.
const canvas = document.getElementById('screen');
const renderer = new Renderer(canvas, THEME);
const panel = new Panel(document, THEME);

// One memorial for the whole browser: it outlives every run, which is the point.
const memorial = new Memorial(browserStorage());
let game;
// `x` arms a drop; the next slot key resolves it. Anything else cancels.
let pendingDrop = false;

function newGame(seed) {
  pendingDrop = false;
  game = new Game({ seed, theme: THEME, memorial });
  renderer.resize(game.level.width, game.level.height);
  redraw();
}

function redraw() {
  renderer.draw(game);
  panel.update(game);
  document.body.classList.toggle('over', game.state !== 'playing');
}

function handleIntent(intent) {
  if (intent.type === 'restart') {
    // Debug hook: poke at the live game from the browser console.
globalThis.crusade = { get game() { return game; }, memorial, newGame, makeItem, makeMonster, ITEMS, MONSTERS, gainXp };

newGame();

// The canvas measures the font at draw time, so a first paint before IBM Plex
// Mono arrives would lay the glyph grid out in the fallback face.
globalThis.document?.fonts?.ready.then(redraw);
    return;
  }
  if (game.state !== 'playing') return;

  const wasPendingDrop = pendingDrop;
  pendingDrop = false;

  let acted = false;
  switch (intent.type) {
    case 'move': acted = moveOrAttack(game, game.player, intent.dx, intent.dy); break;
    case 'wait': acted = wait(); break;
    case 'pickup': acted = pickUp(game, game.player); break;
    case 'fire': acted = fire(game, game.player); break;
    case 'use':
      acted = wasPendingDrop
        ? dropItem(game, game.player, intent.index)
        : useItem(game, game.player, intent.index);
      break;
    case 'drop':
      if (!game.player.inventory.length) game.log('Your pack is already empty.', 'textDim');
      else { pendingDrop = true; game.log('Drop which? [1-9]', 'textDim'); }
      break;
    case 'descend': acted = descend(game); break;
  }

  // Claiming the Relic ends the run mid-action; do not hand the floor back.
  if (acted && game.state === 'playing') game.playerActed();
  redraw();
}

window.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const intent = keyToIntent(event);
  if (!intent) return;
  event.preventDefault();
  handleIntent(intent);
});

// Debug hook: poke at the live game from the browser console.
globalThis.crusade = { get game() { return game; }, memorial, newGame, makeItem, makeMonster, ITEMS, MONSTERS, gainXp };

newGame();
</script>
