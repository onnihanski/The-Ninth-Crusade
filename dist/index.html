const ICON_KEYS = Object.keys(ICONS);

// ==== src/ui/painter.js ====================
// A tiny drawing surface for creature icons.
//
// Icons are described in unit space -- 0..1 across and 0..1 down -- so one
// definition serves every cell size the renderer picks, and the shapes stay
// crisp instead of being resampled from a bitmap. The painter holds the
// current origin, scale and colour so the definitions themselves stay short
// enough to read as drawings rather than as code.
function makePainter(ctx) {
  let ox = 0;
  let oy = 0;
  let sx = 1;
  let sy = 1;

  const X = (v) => ox + v * sx;
  const Y = (v) => oy + v * sy;
  const thickness = (w) => Math.max(1, w * Math.min(sx, sy));

  const trace = (points) => {
    ctx.beginPath();
    points.forEach(([x, y], i) => (i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))));
  };

  return {
    /** Aim the painter at one cell, at one size, in one colour. */
    place(originX, originY, width, height, color) {
      ox = originX;
      oy = originY;
      sx = width;
      sy = height;
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
    },

    poly(points) {
      trace(points);
      ctx.closePath();
      ctx.fill();
    },

    /** An open path, for limbs, chains, blades and wisps. */
    line(points, width = 0.09) {
      trace(points);
      ctx.lineWidth = thickness(width);
      ctx.stroke();
    },

    rect(x, y, w, h) {
      ctx.fillRect(X(x), Y(y), w * sx, h * sy);
    },

    dot(cx, cy, r) {
      ctx.beginPath();
      ctx.ellipse(X(cx), Y(cy), r * sx, r * sy, 0, 0, Math.PI * 2);
      ctx.fill();
    },

    /** An unfilled circle -- a halo, or a hollow where a head should be. */
    ring(cx, cy, r, width = 0.07) {
      ctx.beginPath();
      ctx.ellipse(X(cx), Y(cy), r * sx, r * sy, 0, 0, Math.PI * 2);
      ctx.lineWidth = thickness(width);
      ctx.stroke();
    },

    /** A part-circle, for sound carrying and for things swung on a chain. */
    arc(cx, cy, r, from, to, width = 0.07) {
      ctx.beginPath();
      ctx.ellipse(X(cx), Y(cy), r * sx, r * sy, 0, from, to);
      ctx.lineWidth = thickness(width);
      ctx.stroke();
    },
  };
}

// ==== src/ui/render.js =====================
// ---------------------------------------------------------------------------
// Canvas renderer.
//
// Terrain is drawn as ground rather than lettering: walls are filled mass with
// a lit rim on every face that meets open floor, and floors are a tinted wash.
// Only things that are *objects* -- stairs, gates, doors, monsters, items, the
// crusader -- are still drawn as glyphs.
//
// This is what makes the four region silhouettes legible. In '#' and '.' the
// Choir's pillared halls and the Empty Tomb's caves look nearly identical; as
// solid mass they read as completely different places.
//
// Everything outside this file still talks in glyphs and colour keys, never
// pixels, so a tileset would replace `putGlyph` and the fills and touch nothing
// else.
// ---------------------------------------------------------------------------


/** Faces of a wall cell, and which side of the cell each one draws on. */
const FACES = [
  { dx: 0, dy: -1, side: 'top' },
  { dx: 1, dy: 0, side: 'right' },
  { dx: 0, dy: 1, side: 'bottom' },
  { dx: -1, dy: 0, side: 'left' },
];

const REMEMBERED = 0.62;      // how far unlit ground fades toward the background

// Light falloff. Visibility used to be a switch -- lit or remembered -- which
// made the edge of sight a hard line and gave the torch no presence at all.
// A lit cell now sits somewhere on a ramp between the two shades according to
// its distance from the crusader, so the two states became one continuum and
// no new colours were needed to do it.
const LIGHT_STEPS = 12;       // rungs on the ramp; enough to avoid banding
const EDGE_FADE = 0.82;       // how far the last ring of sight falls toward dark
const FALLOFF = 1.5;          // >1 keeps the near ring bright and drops off late

class Renderer {
  constructor(canvas, theme) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.theme = theme;
    this.cellW = theme.cell.w;
    this.cellH = theme.cell.h;
  }

  /**
   * Scale the glyph grid to the space available rather than assuming a fixed
   * cell size. This is what keeps the whole game inside one viewport on any
   * screen instead of pushing the page into a scrollbar.
   */
  fit(availableWidth, availableHeight, cols, rows) {
    // Square cells. They were taller than wide because a cell used to hold a
    // monospace letter; nothing depends on a text grid any more, and square
    // ground reads as tiles rather than as bricks stood on end.
    const cell = Math.min(
      Math.floor(availableWidth / cols),
      Math.floor(availableHeight / rows),
    );

    this.cellW = Math.max(4, cell);
    this.cellH = this.cellW;
    this.resize(cols, rows);
  }

  resize(widthInCells, heightInCells) {
    const dpr = globalThis.devicePixelRatio || 1;
    const w = widthInCells * this.cellW;
    const h = heightInCells * this.cellH;
    this.canvas.width = w * dpr;
    this.canvas.height = h * dpr;
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /**
   * The shades this floor is drawn in, derived from the region's own two
   * colours. Regions keep defining just `wall` and `floor`; the mass, the rim
   * and the wash all fall out of those, so a new region needs no new palette.
   */
  shades(colors) {
    const bg = colors.bg;

    // Rock reads as lit mass and floor as the dark you walk on, so the two
    // are pushed apart rather than sitting at the same value. The region's
    // `floor` colour is the lighter of its two, so it takes the heavier fade.
    const wallLit = mix(colors.wall, bg, 0.26);
    const wallDim = mix(colors.wall, bg, 0.74);
    const rimLit = mix(colors.wall, '#ffffff', 0.18);
    const rimDim = mix(colors.wall, bg, 0.62);
    const faceLit = mix(colors.wall, '#ffffff', 0.35);  // the side a light from above falls on
    const floorLit = mix(colors.floor, bg, 0.60);
    const floorDim = mix(colors.floor, bg, 0.90);

    // Each ramp runs from the lit shade to the remembered one, so a cell at
    // the edge of the torch arrives at exactly the colour it will keep once
    // the crusader walks away from it.
    return {
      wall: ramp(wallLit, wallDim),
      floor: ramp(floorLit, floorDim),
      rim: ramp(rimLit, rimDim),
      face: ramp(faceLit, rimDim),
      wallDim, floorDim, rimDim,
    };
  }

  /** Which rung of the light ramp a cell sits on. 0 is at the crusader's feet. */
  lightAt(x, y) {
    const distance = Math.hypot(x - this.eye.x, y - this.eye.y);
    const t = Math.min(1, distance / this.radius);
    return Math.min(LIGHT_STEPS, Math.round((t ** FALLOFF) * EDGE_FADE * LIGHT_STEPS));
  }

  draw(game) {
    const { ctx } = this;
    const level = game.level;
    const colors = game.palette();
    const shade = this.shades(colors);

    this.eye = { x: game.player.x, y: game.player.y };
    this.radius = Math.max(1, game.theme.fovRadius);

    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    this.drawGround(level, shade);
    this.drawWallFaces(level, shade);
    this.drawTileGlyphs(level, colors);
    this.drawEntities(level, colors);
  }

  /** Pass one: every known cell is filled, as mass or as floor. */
  drawGround(level, shade) {
    for (let y = 0; y < level.height; y++) {
      for (let x = 0; x < level.width; x++) {
        const visible = level.visible.get(x, y);
        if (!visible && !level.explored.get(x, y)) continue;

        const tile = level.tiles.get(x, y);
        const rung = visible ? this.lightAt(x, y) : -1;

        if (tile.walkable) {
          // A touch of grain, fixed per tile, so a floor is not a flat slab.
          const grain = (hash(x, y) - 0.5) * 0.016;
          const base = visible ? shade.floor[rung] : shade.floorDim;
          this.fillCell(x, y, shiftLightness(base, grain));
        } else {
          this.fillCell(x, y, visible ? shade.wall[rung] : shade.wallDim);
        }
      }
    }
  }

  /**
   * Pass two: a lit rim on every wall face that meets open ground. This is the
   * whole trick -- an unbroken block of colour reads as nothing, and the same
   * block with its edges picked out reads as architecture.
   */
  drawWallFaces(level, shade) {
    const { ctx } = this;
    const thickness = Math.max(1, Math.round(this.cellH * 0.09));

    for (let y = 0; y < level.height; y++) {
      for (let x = 0; x < level.width; x++) {
        const visible = level.visible.get(x, y);
        if (!visible && !level.explored.get(x, y)) continue;
        if (level.tiles.get(x, y).walkable) continue;

        for (const { dx, dy, side } of FACES) {
          const nx = x + dx;
          const ny = y + dy;
          if (!level.tiles.inBounds(nx, ny)) continue;

          const neighbourKnown = level.visible.get(nx, ny) || level.explored.get(nx, ny);
          if (!neighbourKnown || !level.tiles.get(nx, ny).walkable) continue;

          // The south face is the one a light from above would fall on, so it
          // gets the brightest treatment and the block gains a little depth.
          // A face is lit by whichever of its two cells the torch reaches.
          const neighbourVisible = level.visible.get(nx, ny);
          const rung = visible ? this.lightAt(x, y)
            : neighbourVisible ? this.lightAt(nx, ny) : -1;
          ctx.fillStyle = rung < 0 ? shade.rimDim
            : (side === 'bottom' ? shade.face[rung] : shade.rim[rung]);

          const px = x * this.cellW;
          const py = y * this.cellH;
          if (side === 'top') ctx.fillRect(px, py, this.cellW, thickness);
          if (side === 'bottom') ctx.fillRect(px, py + this.cellH - thickness, this.cellW, thickness);
          if (side === 'left') ctx.fillRect(px, py, thickness, this.cellH);
          if (side === 'right') ctx.fillRect(px + this.cellW - thickness, py, thickness, this.cellH);
        }
      }
    }
  }

  /** Pass three: terrain that is an object rather than ground keeps its glyph. */
  drawTileGlyphs(level, colors) {
    this.prepareText();
    for (let y = 0; y < level.height; y++) {
      for (let x = 0; x < level.width; x++) {
        const visible = level.visible.get(x, y);
        if (!visible && !level.explored.get(x, y)) continue;

        const tile = level.tiles.get(x, y);
        if (!tile.drawGlyph) continue;
        const base = colors[tile.key] ?? colors.text;
        const faded = mix(base, colors.bg, REMEMBERED);
        this.putGlyph(x, y, tile.glyph,
          visible ? mix(base, faded, this.lightAt(x, y) / LIGHT_STEPS) : faded);
      }
    }
  }

  /**
   * Pass four: entities, only where the player can actually see. Corpses and
   * items draw under anything standing on them.
   */
  drawEntities(level, colors) {
    this.prepareText();
    this.painter ??= makePainter(this.ctx);

    const baseW = this.cellW * 0.94;
    const baseH = this.cellH * 0.94;

    const sorted = [...level.entities].sort((a, b) => layer(a) - layer(b));
    for (const e of sorted) {
      if (!level.visible.get(e.x, e.y)) continue;

      // Something at the far edge of the torch is harder to make out, which is
      // most of what makes a lit radius feel like light rather than a mask.
      const base = colors[e.color] ?? colors.text;
      const rung = this.lightAt(e.x, e.y) / LIGHT_STEPS;
      const tint = mix(base, mix(base, colors.bg, 0.55), rung);

      // Anything without an icon -- items, and anything added later -- keeps
      // its glyph, so the map can never come up blank.
      const icon = ICONS[e.iconKey];
      if (!icon) {
        this.putGlyph(e.x, e.y, e.glyph, tint);
        continue;
      }

      // A boss draws past the edges of its own cell. It is the only thing that
      // does, and it is the cheapest way to make one loom without giving it a
      // second tile to stand on.
      const scale = e.iconScale ?? 1;
      const iconW = baseW * scale;
      const iconH = baseH * scale;

      this.painter.place(
        e.x * this.cellW + (this.cellW - iconW) / 2,
        e.y * this.cellH + (this.cellH - iconH) / 2,
        iconW, iconH, tint,
      );
      icon(this.painter);
    }
  }

  prepareText() {
    const { ctx } = this;
    ctx.font = Math.round(this.cellH * 0.78) + 'px '
      + (this.theme.fontFamily ?? 'monospace');
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
  }

  fillCell(x, y, color) {
    this.ctx.fillStyle = color;
    this.ctx.fillRect(x * this.cellW, y * this.cellH, this.cellW, this.cellH);
  }

  putGlyph(x, y, glyph, color) {
    this.ctx.fillStyle = color;
    this.ctx.fillText(glyph, x * this.cellW + this.cellW / 2, y * this.cellH + this.cellH / 2 + 1);
  }
}

function layer(entity) {
  if (entity.isPlayer) return 3;
  if (entity.ai && entity.alive) return 2;
  if (entity.item) return 1;
  return 0;
}

/**
 * A precomputed run of shades from lit to remembered. Built once per draw
 * rather than blended per cell: a full floor is well over two thousand cells,
 * and each blend parses two colour strings.
 */
function ramp(from, to) {
  return Array.from({ length: LIGHT_STEPS + 1 },
    (_, i) => mix(from, to, i / LIGHT_STEPS));
}

/** Stable per-tile noise, so floor grain never shimmers between frames. */
function hash(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/** Blend `hex` toward `toward` by `amount`. */
function mix(hex, toward, amount) {
  const a = parseHex(hex);
  const b = parseHex(toward);
  return 'rgb(' + a.map((channel, i) =>
    Math.round(channel + (b[i] - channel) * amount)).join(',') + ')';
}

function shiftLightness(color, amount) {
  const [r, g, b] = parseColor(color);
  const shift = Math.round(255 * amount);
  return 'rgb(' + [r, g, b]
    .map((channel) => Math.max(0, Math.min(255, channel + shift)))
    .join(',') + ')';
}

function parseColor(color) {
  return color.startsWith('#') ? parseHex(color) : parseRgb(color);
}

function parseHex(hex) {
  if (!hex.startsWith('#')) return parseRgb(hex);
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function parseRgb(value) {
  const parts = value.match(/-?\d+/g);
  return parts ? parts.slice(0, 3).map(Number) : [0, 0, 0];
}

// ==== src/ui/input.js ======================
// Key bindings -> intents.
//
// WASD for the cardinals, QEZC for the diagonals. The diagonals are not
// optional garnish: monsters move and attack on all eight directions, so a
// player limited to four would be flanked with no way to answer. The numpad
// and arrow keys stay bound for people who reach for them.
const MOVES = {
  w: [0, -1], a: [-1, 0], s: [0, 1], d: [1, 0],
  q: [-1, -1], e: [1, -1], z: [-1, 1], c: [1, 1],
  ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
};

// Numpad only -- the digit row is inventory slots.
const NUMPAD_MOVES = {
  8: [0, -1], 2: [0, 1], 4: [-1, 0], 6: [1, 0],
  7: [-1, -1], 9: [1, -1], 1: [-1, 1], 3: [1, 1],
};

function keyToIntent(event) {
  const raw = event.key;
  const key = raw.length === 1 ? raw.toLowerCase() : raw;
  const fromNumpad = event.code.startsWith('Numpad');

  if (fromNumpad) {
    if (NUMPAD_MOVES[key]) return { type: 'move', dx: NUMPAD_MOVES[key][0], dy: NUMPAD_MOVES[key][1] };
    if (key === '5') return { type: 'wait' };
  }

  if (MOVES[key]) return { type: 'move', dx: MOVES[key][0], dy: MOVES[key][1] };

  if (/^[1-9]$/.test(key)) return { type: 'use', index: Number(key) - 1 };
  if (key === ' ' || key === '.') return { type: 'wait' };
  if (key === 'g' || key === ',') return { type: 'pickup' };
  if (key === 'x') return { type: 'drop' };
  if (key === 'm') return { type: 'merge' };
  if (key === 'f') return { type: 'fire' };
  if (key === 'n') return { type: 'rename' };
  if (raw === '>') return { type: 'descend' };
  if (key === 'r') return { type: 'restart' };
  return null;
}

const HELP = [
  ['move', 'W A S D'],
  ['diagonals', 'Q E Z C'],
  ['wait', 'space'],
  ['fire', 'f'],
  ['take', 'g'],
  ['use / wear', '1-9'],
  ['drop', 'x then 1-9'],
  ['merge', 'm'],
  ['descend', '>'],
  ['name', 'n'],
  ['dev menu', '0'],
  ['restart', 'r'],
];

// ==== src/ui/panel.js ======================
// The HTML side of the UI: who you are, where you are, what you are carrying,
// and what the dungeon has been saying.
class Panel {
  constructor(root, theme) {
    this.theme = theme;
    this.el = {};
    for (const id of ['depth', 'region', 'hp-fill', 'hp-text', 'stats', 'statuses',
      'inventory', 'worn', 'seals', 'log', 'seed', 'help', 'title', 'crusader',
      'level', 'xp-fill', 'xp-text', 'tooltip', 'rename']) {
      this.el[id] = root.querySelector('#' + id);
    }

    // The pack and kit lists are rebuilt only when their contents change, so a
    // tooltip does not blink out from under the pointer every turn.
    this.kitSignature = null;

    this.el.title.textContent = theme.name;
    this.el.help.innerHTML = HELP
      .map(([label, keys]) => '<li><span>' + label + '</span><kbd>' + keys + '</kbd></li>')
      .join('');
  }

  update(game) {
    const p = game.player;
    const colors = game.palette();
    const ratio = Math.max(0, p.hp) / p.maxHp;

    this.el.crusader.textContent = game.crusaderName;
    this.el.region.textContent = game.region.name;
    this.el.region.style.color = colors.notable;
    this.el.depth.textContent = this.theme.strings.floorLabel + ' ' + game.level.depth
      + (game.level.sealed ? '  — sealed' : '');

    this.el['hp-fill'].style.width = (ratio * 100).toFixed(1) + '%';
    this.el['hp-fill'].style.background =
      ratio > 0.5 ? colors.good : ratio > 0.25 ? colors.notable : colors.bad;
    this.el['hp-text'].textContent = Math.max(0, p.hp) + ' / ' + p.maxHp;

    const need = xpToNext(p.level);
    this.el.level.textContent = 'Level ' + p.level;
    this.el['xp-fill'].style.width = (100 * Math.min(1, p.xp / need)).toFixed(1) + '%';
    this.el['xp-fill'].style.background = colors.xp;
    this.el['xp-text'].textContent = p.xp + ' / ' + need + ' xp';
    // Show the numbers gear actually produces, not the naked ones.
    const speed = effectiveSpeed(p);
    this.el.stats.innerHTML =
      stat('power', effectivePower(p), p.power, colors)
      + stat('defense', effectiveDefense(p), p.defense, colors)
      + stat('speed', speed, 100, colors)
      + (rangedProfile(p)
        ? '<span class="stat">' + (p.reloadLeft > 0
          ? '<b style="color:' + colors.bad + '">reloading</b>'
          : '<b style="color:' + colors.good + '">loaded</b>') + '</span>'
        : '');

    const stances = (p.statuses ?? []).map((s) =>
      '<span class="tag" style="color:' + colors.good + '">'
      + s.kind + ' +' + s.amount + ' (' + s.turns + ')</span>');

    const sanctuary = sanctuaryBonus(p);
    if (sanctuary > 0) {
      stances.push('<span class="tag" style="color:' + colors.mythic + '">sanctuary +'
        + sanctuary + '</span>');
    }
    if (hasTrait(p, 'block')) {
      stances.push(p.blockCooldown > 0
        ? '<span class="tag" style="color:' + colors.bad + '">shield down (' + p.blockCooldown + ')</span>'
        : '<span class="tag" style="color:' + colors.good + '">shield up</span>');
    }
    for (const merge of p.merges ?? []) {
      stances.push('<span class="tag" style="color:' + colors.notable + '">'
        + escapeHtml(MERGE_LABEL[merge.boon.stat]) + ' +' + merge.boon.amount + '</span>');
    }
    this.el.statuses.innerHTML = stances.join(' ');

    this.game = game;
    this.renderKit(game, colors);

    const seals = game.seals();
    this.el.seals.innerHTML = seals.length
      ? seals.map((s) => '<span class="tag" style="color:' + colors.seal + '">'
        + escapeHtml(s.name) + '</span>').join(' ')
      : '<span class="empty">none yet</span>';

    const recent = game.messages.slice(-14);
    this.el.log.innerHTML = recent.map((m, i) => {
      const color = colors[m.color] ?? colors.text;
      const faded = i < recent.length - 5 ? 0.5 : 1;
      const suffix = m.count > 1 ? ' <em>x' + m.count + '</em>' : '';
      return '<li style="color:' + color + ';opacity:' + faded + '">'
        + escapeHtml(m.text) + suffix + '</li>';
    }).join('');
    this.el.log.scrollTop = this.el.log.scrollHeight;

    this.el.seed.textContent = 'seed ' + game.seed + '  ·  crusade #' + game.memorial.runNumber();
  }
}

const SLOT_LABEL = { weapon: 'held', shield: 'shield', armour: 'worn' };

/** A stat, with its modified value called out when gear has changed it. */
function stat(label, value, base, colors) {
  const color = value === base ? colors.textDim : value > base ? colors.good : colors.bad;
  return '<span class="stat">' + label
    + ' <b style="color:' + color + '">' + value + '</b></span>';
}

Panel.prototype.renderKit = function renderKit(game, colors) {
  const p = game.player;
  const stamp = (item) => item
    ? item.item.key + (item.item.heirloom ? '#' + item.item.heirloom.marks : '')
    : '-';
  const signature = p.inventory.map(stamp).join(',')
    + '|' + SLOTS.map((slot) => stamp(p.equipment[slot])).join(',');
  if (signature === this.kitSignature) return;
  this.kitSignature = signature;

  this.el.worn.innerHTML = SLOTS.map((slot) => {
    const item = p.equipment[slot];
    const label = '<span class="slot">' + SLOT_LABEL[slot] + '</span>';
    if (!item) return '<li>' + label + '<span class="empty">—</span></li>';
    const color = colors[item.color] ?? colors.gear;
    return '<li data-source="kit" data-slot="' + slot + '" tabindex="0">' + label
      + '<span style="color:' + color + '">' + escapeHtml(item.name) + '</span>'
      + heirloomMark(item, colors) + '</li>';
  }).join('');

  this.el.inventory.innerHTML = p.inventory.length
    ? p.inventory.map((item, i) => {
      const spec = ITEMS[item.item.key] ?? item.item;
      const color = colors[item.color] ?? colors.text;
      return '<li data-source="pack" data-index="' + i + '" tabindex="0">'
        + '<kbd>' + (i + 1) + '</kbd> '
        + '<span class="iname" style="color:' + color + '">' + escapeHtml(item.name)
        + '</span>' + heirloomMark(item, colors)
        + '<span class="icat">' + escapeHtml(itemCategory(spec)) + '</span></li>';
    }).join('')
    : '<li class="empty">(empty)</li>';

  this.bindTooltips(colors);
};

/**
 * Hovering an item explains what it does and where it came from. The mechanics
 * half is derived from the item data rather than written out again, so it can
 * never drift from what the game actually does.
 */
Panel.prototype.bindTooltips = function bindTooltips(colors) {
  const tip = this.el.tooltip;
  const rows = [
    ...this.el.inventory.querySelectorAll('[data-source]'),
    ...this.el.worn.querySelectorAll('[data-source]'),
  ];

  const instanceFor = (row) => {
    const p = this.game?.player;
    if (!p) return null;
    return row.dataset.source === 'kit'
      ? p.equipment[row.dataset.slot]
      : p.inventory[Number(row.dataset.index)];
  };

  const show = (row) => {
    const instance = instanceFor(row);
    const spec = instance && ITEMS[instance.item.key];
    if (!spec) return;
    const d = describeItem(spec, instance.item);
    const meta = [d.category, d.rarity].filter(Boolean).join(' · ');
    tip.innerHTML =
      '<h3 style="color:' + (colors[spec.color] ?? colors.text) + '">'
      + escapeHtml(d.name) + '</h3>'
      + '<div class="tip-meta">' + escapeHtml(meta) + '</div>'
      + (d.trait
        ? '<div class="tip-trait" style="color:' + colors.mythic + '">'
          + escapeHtml(d.trait.label) + '</div>'
          + '<p class="tip-trait-text">' + escapeHtml(d.trait.text) + '</p>'
        : '')
      + '<ul>' + d.effects.map((e) => '<li>' + escapeHtml(e) + '</li>').join('') + '</ul>'
      + (d.heirloom
        ? '<p class="tip-heirloom" style="color:' + colors.revenant + '">+'
          + d.heirloom.bonus + ' — ' + escapeHtml(d.heirloom.label) + '</p>'
        : '')
      + '<p class="tip-lore">' + escapeHtml(d.lore) + '</p>';
    tip.hidden = false;
    tip.setAttribute('aria-hidden', 'false');

    // Sits to the left of the panel, clamped into the viewport.
    const rect = row.getBoundingClientRect();
    const box = tip.getBoundingClientRect();
    const left = Math.max(8, rect.left - box.width - 12);
    const top = Math.min(
      Math.max(8, rect.top - 8),
      Math.max(8, window.innerHeight - box.height - 8),
    );
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  };

  const hide = () => {
    tip.hidden = true;
    tip.setAttribute('aria-hidden', 'true');
  };

  for (const row of rows) {
    row.addEventListener('mouseenter', () => show(row));
    row.addEventListener('focus', () => show(row));
    row.addEventListener('mouseleave', hide);
    row.addEventListener('blur', hide);
  }
  hide();
};

/** Gear taken off a predecessor wears its bonus openly in the list. */
function heirloomMark(item, colors) {
  const bonus = heirloomBonus(item.item.heirloom);
  if (!bonus) return '';
  return '<span class="heir" style="color:' + colors.revenant + '">+' + bonus + '</span>';
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}

// ==== src/ui/devmenu.js ====================
// ---------------------------------------------------------------------------
// Dev menu.
//
// Every system in this game is several floors deep behind a random dungeon,
// which makes checking any one of them by playing to it impractical. This puts
// each of them one click away, and prints the derived numbers beside the base
// ones so a formula can be read rather than inferred.
//
// Opened with 0 or F1. Deliberately not discoverable by accident, and equally
// deliberately always available -- it is as useful for looking at a live bug as
// it is for looking at a feature.
// ---------------------------------------------------------------------------
class DevMenu {
  constructor(root, hooks) {
    this.hooks = hooks;
    this.el = root.getElementById('dev');
    this.body = root.getElementById('dev-body');
    this.readout = root.getElementById('dev-readout');
    if (!this.el) return;

    root.getElementById('dev-close').addEventListener('click', () => this.close());
    this.build();
    this.el.hidden = true;
  }

  get game() {
    return this.hooks.getGame();
  }

  /** Run a mutation and put the world back on screen. */
  act(fn) {
    fn(this.game);
    this.hooks.redraw();
    this.refresh();
  }

  toggle() {
    if (this.el.hidden) this.open();
    else this.close();
  }

  open() {
    this.el.hidden = false;
    this.refresh();
  }

  close() {
    this.el.hidden = true;
  }

  get isOpen() {
    return !this.el.hidden;
  }

  // -- construction ---------------------------------------------------------

  build() {
    this.body.replaceChildren(
      this.depthSection(),
      this.characterSection(),
      this.gearSection(),
      this.spawnSection(),
      this.storySection(),
      this.memorialSection(),
      this.worldSection(),
    );
  }

  section(title, ...children) {
    const wrap = document.createElement('section');
    const heading = document.createElement('h3');
    heading.textContent = title;
    wrap.append(heading, ...children);
    return wrap;
  }

  row(...children) {
    const div = document.createElement('div');
    div.className = 'dev-row';
    div.append(...children);
    return div;
  }

  button(label, onClick, title) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    if (title) b.title = title;
    b.addEventListener('click', onClick);
    return b;
  }

  select(groups) {
    const s = document.createElement('select');
    for (const [label, options] of groups) {
      const group = document.createElement('optgroup');
      group.label = label;
      for (const [value, text] of options) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = text;
        group.append(option);
      }
      s.append(group);
    }
    return s;
  }

  // -- sections -------------------------------------------------------------

  depthSection() {
    const depths = this.row(...Array.from({ length: MAX_DEPTH }, (_, i) => {
      const depth = i + 1;
      const region = REGIONS.find((r) => depth >= r.depths[0] && depth <= r.depths[1]);
      const boss = depth === region.depths[1];
      return this.button(String(depth), () => this.act((g) => {
        g.buildLevel(depth);
        g.player.hp = g.player.maxHp;
      }), region.name + (boss ? ' — boss floor' : ''));
    }));

    const shortcuts = this.row(
      ...REGIONS.map((region) => this.button(region.name.replace('The ', ''),
        () => this.act((g) => {
          g.buildLevel(region.depths[0]);
          g.player.hp = g.player.maxHp;
        }), 'first floor of ' + region.name)),
      this.button('reroll floor', () => this.act((g) => g.buildLevel(g.level.depth))),
    );

    return this.section('Depth — each number is a floor, the last of each region is its boss',
      depths, shortcuts);
  }

  characterSection() {
    return this.section('Character',
      this.row(
        this.button('+1 level', () => this.act((g) => gainXp(g, g.player, xpToNext(g.player.level)))),
        this.button('+5 levels', () => this.act((g) => {
          for (let i = 0; i < 5; i++) gainXp(g, g.player, xpToNext(g.player.level));
        })),
        this.button('heal', () => this.act((g) => { g.player.hp = g.player.maxHp; })),
        this.button('hurt to 25%', () => this.act((g) => {
          g.player.hp = Math.max(1, Math.round(g.player.maxHp * 0.25));
        })),
      ),
      this.row(
        this.button('invincible', () => this.act((g) => {
          g.player.maxHp = 9999;
          g.player.hp = 9999;
          g.player.defense = 99;
        }), 'survive anything, to inspect a fight at leisure'),
        this.button('glass cannon', () => this.act((g) => { g.player.power = 500; }),
          'one-shot anything, to reach a later floor quickly'),
        this.button('reset stats', () => this.act((g) => {
          g.player.power = 5;
          g.player.defense = 1;
          g.player.maxHp = 26 + (g.player.level - 1) * 4;
          g.player.hp = g.player.maxHp;
        })),
      ),
    );
  }

  gearSection() {
    const gear = Object.entries(ITEMS);
    const byCategory = new Map();
    for (const [key, spec] of gear) {
      const category = itemCategory(spec);
      if (!byCategory.has(category)) byCategory.set(category, []);
      byCategory.get(category).push([key, spec.name
        + (spec.rarity ? ' (' + spec.rarity + ')' : '')
        + (spec.trait ? ' — ' + spec.trait : '')]);
    }
    const picker = this.select([...byCategory.entries()]);

    return this.section('Gear',
      this.row(
        picker,
        this.button('give', () => this.act((g) => {
          g.player.inventory.push(makeItem({ key: picker.value, ...ITEMS[picker.value] }, 0, 0));
          g.log('[dev] ' + ITEMS[picker.value].name + ' added to the pack.', 'textDim');
        })),
        this.button('give ×2 (mergeable)', () => this.act((g) => {
          for (let i = 0; i < 2; i++) {
            g.player.inventory.push(makeItem({ key: picker.value, ...ITEMS[picker.value] }, 0, 0));
          }
        })),
        this.button('give as heirloom', () => this.act((g) => {
          const item = makeItem({ key: picker.value, ...ITEMS[picker.value] }, 0, 0);
          item.item.heirloom = { of: 'Pilgrim Test the Deceased', deepest: 12, marks: 3 };
          g.player.inventory.push(item);
        }), 'a piece taken off a predecessor who died at the bottom'),
      ),
      this.row(
        this.button('all sacred gear', () => this.act((g) => {
          for (const [key, spec] of gear) {
            if (spec.rarity === 'sacred') {
              g.player.inventory.push(makeItem({ key, ...spec }, 0, 0));
            }
          }
        }), 'the trait-carrying pieces: cleave, reach, pierce, block, riposte, sanctuary'),
        this.button('every relic', () => this.act((g) => {
          for (const [key, spec] of gear) {
            if (spec.use) g.player.inventory.push(makeItem({ key, ...spec }, 0, 0));
          }
        })),
        this.button('merge a pair', () => this.act((g) => mergeDuplicates(g, g.player))),
        this.button('empty pack', () => this.act((g) => { g.player.inventory.length = 0; })),
      ),
    );
  }

  spawnSection() {
    const monsters = Object.entries(MONSTERS);
    const picker = this.select([
      ['rank and file', monsters.filter(([, m]) => !m.boss)
        .map(([key, m]) => [key, m.name + (m.ranged ? ' (ranged)' : '')])],
      ['bosses', monsters.filter(([, m]) => m.boss)
        .map(([key, m]) => [key, m.name + ' — ' + m.bossTrait])],
    ]);

    const placeNear = (g, make) => {
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1], [2, 0], [0, 2], [-2, 0], [0, -2]]) {
        const x = g.player.x + dx;
        const y = g.player.y + dy;
        if (g.level.isOpen(x, y)) {
          g.level.add(make(x, y));
          return true;
        }
      }
      g.log('[dev] nowhere beside you to put it.', 'textDim');
      return false;
    };

    return this.section('Spawn — placed beside you',
      this.row(
        picker,
        this.button('spawn', () => this.act((g) => placeNear(g, (x, y) => {
          const spec = { key: picker.value, ...MONSTERS[picker.value] };
          const monster = makeMonster(spec, x, y);
          monster.ai.hunting = true;
          return monster;
        }))),
        this.button('spawn ×4', () => this.act((g) => {
          for (let i = 0; i < 4; i++) {
            placeNear(g, (x, y) => {
              const m = makeMonster({ key: picker.value, ...MONSTERS[picker.value] }, x, y);
              m.ai.hunting = true;
              return m;
            });
          }
        }), 'for checking cleave, or a piercing bolt down a line'),
      ),
      this.row(
        this.button('spawn a revenant', () => this.act((g) => placeNear(g, (x, y) => {
          const revenant = makeRevenant({
            name: 'Pilgrim Test the Deceased',
            depth: g.level.depth, level: 8, power: 9, defense: 4, maxHp: 40,
            relics: ['reliquaryPhial'],
            equipment: [{ key: 'martyrsGreatsword', heirloom: null }],
          }, x, y);
          revenant.ai.hunting = true;
          return revenant;
        })), 'carries gear it gains nothing from, and drops all of it'),
        this.button('kill everything', () => this.act((g) => {
          for (const e of [...g.level.entities]) {
            if (e.ai && e.alive) damage(g, e, 99999, g.player);
          }
        })),
      ),
    );
  }

  storySection() {
    return this.section('Story — panels, in order',
      this.row(...REGIONS.filter((r) => GATE_CHAPTERS[r.key]).map((region) =>
        this.button(GATE_CHAPTERS[region.key].title, () => this.act((g) => {
          const chapter = GATE_CHAPTERS[region.key];
          g.tellStory({ kind: 'chapter', title: chapter.title, lines: chapter.lines });
        })))),
      this.row(...REGIONS.map((region) => {
        const lore = BOSS_LORE[region.boss];
        return this.button(lore.title.replace(/^the /, ''), () => this.act((g) => {
          g.tellStory({
            kind: 'boss', title: lore.title, lines: lore.lines, mechanic: lore.mechanic,
          });
        }), region.final ? 'the reveal' : 'boss lore');
      })),
    );
  }

  memorialSection() {
    return this.section('Memorial',
      this.row(
        this.button('add a predecessor here', () => this.act((g) => {
          g.memorial.record({
            name: 'Pilgrim Test ' + (g.memorial.entries.length + 1),
            depth: g.level.depth, region: g.region.name, killedBy: 'the dev menu',
            level: 6, power: 8, defense: 3, maxHp: 38, turn: 1, at: Date.now(),
            relics: ['reliquaryPhial'],
            equipment: [{ key: 'mailHauberk', heirloom: null }],
          });
          g.log('[dev] recorded. Reroll this floor to meet them.', 'textDim');
        }), 'then reroll the floor — nobody returns above depth 3'),
        this.button('clear memorial', () => this.act((g) => {
          g.memorial.clear();
          g.log('[dev] memorial cleared.', 'textDim');
        })),
        this.button('new crusade', () => { this.hooks.newGame(); this.refresh(); }),
      ),
    );
  }

  worldSection() {
    return this.section('World',
      this.row(
        this.button('reveal map', () => this.act((g) => {
          g.level.explored.fill(true);
        })),
        this.button('open the arena door', () => this.act((g) => {
          if (!g.level.door) {
            g.log('[dev] this floor has no arena.', 'textDim');
            return;
          }
          g.unlockArena();
        })),
        this.button('stand at the arena door', () => this.act((g) => {
          const door = g.level.door;
          if (!door) {
            g.log('[dev] this floor has no arena.', 'textDim');
            return;
          }
          const spot = [[0, -1], [1, 0], [0, 1], [-1, 0]]
            .map(([dx, dy]) => ({ x: door.x + dx, y: door.y + dy }))
            .find((p) => !g.level.inArena(p.x, p.y) && g.level.isWalkable(p.x, p.y));
          if (spot) {
            g.player.x = spot.x;
            g.player.y = spot.y;
            g.level.updateFov(g.player, g.theme.fovRadius);
          }
        })),
        this.button('unseal the gate', () => this.act((g) => {
          if (!g.level.sealed) {
            g.log('[dev] nothing sealed here.', 'textDim');
            return;
          }
          g.level.sealed = false;
          g.log('[dev] gate unsealed.', 'textDim');
        })),
      ),
    );
  }

  // -- live readout ---------------------------------------------------------

  /**
   * Base and derived side by side. Most of this game's numbers are computed
   * from four or five sources at once, and the only honest way to check one is
   * to see the parts next to the total.
   */
  refresh() {
    if (!this.readout || this.el.hidden) return;
    const g = this.game;
    const p = g.player;
    const ranged = rangedProfile(p);
    const worn = Object.entries(p.equipment ?? {})
      .filter(([, item]) => item)
      .map(([slot, item]) => slot + ': ' + item.name
        + (heirloomBonus(item.item.heirloom) ? ' +' + heirloomBonus(item.item.heirloom) : ''));

    const lines = [
      ['crusader', g.crusaderName + '   level ' + p.level
        + '   xp ' + p.xp + '/' + xpToNext(p.level)],
      ['hp', p.hp + ' / ' + p.maxHp + '   regen every ' + regenInterval(p) + ' turns'],
      ['power', p.power + ' base  →  ' + effectivePower(p) + ' effective'
        + '   (merges +' + mergeBonus(p, 'power') + ')'],
      ['defense', p.defense + ' base  →  ' + effectiveDefense(p) + ' effective'
        + '   (sanctuary +' + sanctuaryBonus(p) + ', merges +' + mergeBonus(p, 'defense') + ')'],
      ['speed', p.speed + ' base  →  ' + effectiveSpeed(p) + ' effective'],
      ['ranged', ranged ? ranged.power + ' dmg / ' + ranged.range + ' tiles / reload '
        + ranged.reload + (p.reloadLeft ? '  (reloading ' + p.reloadLeft + ')' : '  (loaded)')
        : 'nothing that shoots'],
      ['traits', traitsOf(p).join(', ') || 'none'
        + (canBlock(p) ? '' : '')],
      ['merges', (p.merges ?? []).map((m) => m.boon.stat + ' +' + m.boon.amount).join(', ') || 'none'],
      ['worn', worn.join('   ') || 'nothing'],
      ['pack', p.inventory.map((i) => i.name).join(', ') || 'empty'],
      ['seals', g.seals().map((s) => s.name).join(', ') || 'none'],
      ['floor', g.region.name + '   depth ' + g.level.depth
        + (g.level.sealed ? '   [gate sealed]' : '')
        + (g.level.bossRoom ? (g.level.doorLocked ? '   [door barred]' : '   [arena, door open]') : '')],
      ['alive here', g.level.entities.filter((e) => e.ai && e.alive).length
        + ' monsters, ' + g.level.entities.filter((e) => e.item).length + ' items on the floor'],
      ['memorial', g.memorial.entries.length + ' recorded  ·  crusade #'
        + g.memorial.runNumber()],
    ];

    this.readout.replaceChildren(...lines.map(([label, value]) => {
      const row = document.createElement('div');
      row.className = 'dev-stat';
      const key = document.createElement('span');
      key.textContent = label;
      const val = document.createElement('b');
      val.textContent = value;
      row.append(key, val);
      return row;
    }));
  }
}

// ==== src/main.js ==========================
// Bootstrap: owns the browser-facing bits and nothing else. All rules live in
// game/, which is why the whole game is testable under node.
const NAME_KEY = 'ninth-crusade.name.v1';

const stage = document.getElementById('stage');
const canvas = document.getElementById('screen');
const storyEl = document.getElementById('story');
const storyTitle = document.getElementById('story-title');
const storyLines = document.getElementById('story-lines');
const storyMechanic = document.getElementById('story-mechanic');
const promptEl = document.getElementById('prompt');
const promptTitle = document.getElementById('prompt-title');
const promptQuestion = document.getElementById('prompt-question');
const promptNote = document.getElementById('prompt-note');
const crusaderEl = document.getElementById('crusader');
const renameButton = document.getElementById('rename');
const renameInput = document.getElementById('rename-input');

const renderer = new Renderer(canvas, THEME);
const panel = new Panel(document, THEME);

// One memorial for the whole browser: it outlives every run, which is the point.
const memorial = new Memorial(browserStorage());

// Every system in this game sits several floors behind a random dungeon.
// The dev menu puts each of them one click away. 0 or F1. The digit row is
// otherwise pack slots, and those only run 1-9, so 0 was going spare.
const dev = new DevMenu(document, {
  getGame: () => game,
  redraw: () => redraw(),
  newGame: () => newGame(),
});
let game;
let pendingDrop = false;   // `x` arms a drop; the next slot key resolves it
let renaming = false;

// -- naming -----------------------------------------------------------------

function storedName() {
  try {
    return globalThis.localStorage?.getItem(NAME_KEY) || null;
  } catch {
    return null;
  }
}

function storeName(name) {
  // Strip any numeral so the next crusader gets their own rather than stacking.
  const base = name.replace(/\s+[IVXLCDM]+$/i, '').trim();
  try {
    globalThis.localStorage?.setItem(NAME_KEY, base);
  } catch {
    // A disabled store costs us the preference, never the run.
  }
}

function startRename() {
  if (renaming || game.state !== 'playing') return;
  renaming = true;
  crusaderEl.hidden = true;
  renameButton.hidden = true;
  renameInput.hidden = false;
  renameInput.value = game.crusaderName;
  renameInput.focus();
  renameInput.select();
}

function finishRename(save) {
  if (!renaming) return;
  renaming = false;
  const value = renameInput.value;
  renameInput.hidden = true;
  crusaderEl.hidden = false;
  renameButton.hidden = false;
  if (save && value.trim()) {
    game.renameCrusader(value);
    storeName(value);
  }
  redraw();
}

renameButton.addEventListener('click', startRename);
renameInput.addEventListener('keydown', (event) => {
  event.stopPropagation();                     // the input owns the keyboard
  if (event.key === 'Enter') finishRename(true);
  if (event.key === 'Escape') finishRename(false);
});
renameInput.addEventListener('blur', () => finishRename(true));

// -- the story card ---------------------------------------------------------

function renderPrompt() {
  const ask = game.prompt;
  if (!ask) {
    promptEl.hidden = true;
    return;
  }
  promptTitle.textContent = ask.title;
  promptQuestion.textContent = ask.question;
  promptNote.textContent = ask.note ?? '';
  promptEl.hidden = false;
}

function answerPrompt(yes) {
  if (!game.prompt) return;
  if (yes) game.enterArena();
  else game.declineArena();
  redraw();
}

document.getElementById('prompt-yes').addEventListener('click', () => answerPrompt(true));
document.getElementById('prompt-no').addEventListener('click', () => answerPrompt(false));

function renderStory() {
  const card = game.pendingStory();
  if (!card) {
    storyEl.hidden = true;
    return;
  }
  storyTitle.textContent = card.title;
  storyLines.replaceChildren(...card.lines.map((line) => {
    const p = document.createElement('p');
    p.textContent = line;
    return p;
  }));
  storyMechanic.textContent = card.mechanic ?? '';
  storyEl.hidden = false;
}

// -- lifecycle --------------------------------------------------------------

function newGame(seed) {
  pendingDrop = false;
  game = new Game({ seed, theme: THEME, memorial });

  // A player who has named themselves gets that name, numbered.
  const base = storedName();
  if (base) game.renameCrusader(base + ' ' + roman(memorial.runNumber()));

  fitScreen();
}

/** Scale the map to whatever room the stage has, so the page never scrolls. */
function fitScreen() {
  const rect = stage.getBoundingClientRect();
  renderer.fit(rect.width - 2, rect.height - 2, game.level.width, game.level.height);
  redraw();
}

function redraw() {
  renderer.draw(game);
  panel.update(game);
  renderStory();
  renderPrompt();
  dev.refresh();
  document.body.classList.toggle('over', game.state !== 'playing');
}

function handleIntent(intent) {
  if (intent.type === 'restart') {
    newGame();
    return;
  }
  if (intent.type === 'rename') {
    startRename();
    return;
  }
  if (game.state !== 'playing') return;

  const wasPendingDrop = pendingDrop;
  pendingDrop = false;

  let acted = false;
  switch (intent.type) {
    case 'move': acted = moveOrAttack(game, game.player, intent.dx, intent.dy); break;
    case 'wait': acted = wait(); break;
    case 'pickup': acted = pickUp(game, game.player); break;
    case 'fire': acted = fire(game, game.player); break;
    case 'merge': acted = mergeDuplicates(game, game.player); break;
    case 'use':
      acted = wasPendingDrop
        ? dropItem(game, game.player, intent.index)
        : useItem(game, game.player, intent.index);
      break;
    case 'drop':
      if (!game.player.inventory.length) game.log('Your pack is already empty.', 'textDim');
      else { pendingDrop = true; game.log('Drop which? [1-9]', 'textDim'); }
      break;
    case 'descend': acted = descend(game); break;
  }

  // Claiming the Relic ends the run mid-action; do not hand the floor back.
  if (acted && game.state === 'playing') game.playerActed();
  redraw();
}

window.addEventListener('keydown', (event) => {
  if (renaming) return;
  if (event.ctrlKey || event.metaKey || event.altKey) return;

  if (event.key === '0' || event.key === 'F1') {
    event.preventDefault();
    dev.toggle();
    return;
  }
  // While a control inside the dev menu has focus it owns the keyboard,
  // otherwise picking an item from a list would also walk the crusader.
  if (dev.isOpen && event.target?.closest?.('#dev')) return;

  // A question holds the floor until it is answered.
  if (game.prompt) {
    const key = event.key.toLowerCase();
    if (key === 'y' || key === 'n' || key === 'escape') {
      event.preventDefault();
      answerPrompt(key === 'y');
    }
    return;
  }

  // A story card holds the floor: any key reads on, and none of them is a turn.
  if (game.pendingStory()) {
    event.preventDefault();
    game.dismissStory();
    redraw();
    return;
  }

  const intent = keyToIntent(event);
  if (!intent) return;
  event.preventDefault();
  handleIntent(intent);
});

window.addEventListener('resize', () => fitScreen());

// Debug hook: poke at the live game from the browser console.
globalThis.crusade = {
  get game() { return game; },
  memorial, newGame, makeItem, makeMonster, ITEMS, MONSTERS, ICONS, gainXp,
  makePainter,                                 // for reviewing the icon set
};

newGame();

// The canvas measures the font at draw time, so a first paint before IBM Plex
// Mono arrives would lay the glyph grid out in the fallback face.
globalThis.document?.fonts?.ready.then(fitScreen);
</script>
</body>
</html>
